[project]
name = "novel-agent"
version = "0.1.0"
license = "Apache-2.0"
description = "Dual-mode novel writing AI agent — conversational + autonomous"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.39",
    "rich>=13.0",
]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novel_agent"]
